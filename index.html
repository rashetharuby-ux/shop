<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rashetha's Picks</title>
<meta name="description" content="Skincare, haircare and beauty products I actually use and recommend. Links go to Amazon.in.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF4F2; --ink:#3A1F2B; --muted:#8C7078; --rose:#B4506A; --rule:#E9D8DC;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;font-family:"Fraunces",Georgia,serif;color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  main{max-width:560px;margin:0 auto;padding:56px 22px 64px}
  h1{font-size:2.4rem;font-weight:600;line-height:1.05;margin:0 0 14px;letter-spacing:-.01em}
  .intro{font-size:1.05rem;color:var(--muted);margin:0 0 40px;max-width:36ch}
  ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
  li{padding:22px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:8px 18px;align-items:start}
  .name{font-size:1.25rem;font-weight:600;margin:0}
  .note{margin:0;color:var(--muted);font-size:.98rem;grid-column:1}
  .cat{font-size:.85rem;color:var(--rose);margin:0 0 4px;grid-column:1}
  a.buy{grid-column:2;grid-row:1/span 3;align-self:center;white-space:nowrap;padding:10px 16px;border:1.5px solid var(--rose);border-radius:999px;color:var(--rose);text-decoration:none;font-size:.95rem;font-weight:600}
  a.buy:hover,a.buy:focus-visible{background:var(--rose);color:#fff;outline:none}
  a.buy:focus-visible{box-shadow:0 0 0 3px var(--rule)}
  .disc{margin:40px 0 0;font-size:.9rem;color:var(--muted);max-width:44ch}
  .disc a{color:var(--rose)}
  @media (max-width:420px){
    li{grid-template-columns:1fr}
    a.buy{grid-column:1;grid-row:auto;justify-self:start;margin-top:6px}
  }
</style>
</head>
<body>
<main>
  <h1>Rashetha's Picks</h1>
  <p class="intro">Skincare, haircare and beauty I actually use. Tap any product to see it on Amazon.</p>

  <ol id="list"></ol>

  <p class="disc">As an Amazon Associate I earn from qualifying purchases. Prices and availability are shown on Amazon and may change.</p>
</main>

<script>
  // Add a product: copy one line, change the text and the link.
  const products = [
    { cat:"Body care",  name:"Dove Exfoliating Body Polish",           note:"Crushed macadamia and rice milk scrub. Gentle enough for weekly use.",   url:"https://link.amazon/B0d5Wmydd" },
    { cat:"Haircare",   name:"Indé Wild Hair Oil",                     note:"Pre-wash oil for dry, frizzy hair.",                                    url:"https://link.amazon/B0cImJPJt" },
    { cat:"Haircare",   name:"Love Beauty & Planet Hair Mask",         note:"Deep-conditioning mask for weekly repair.",                            url:"https://link.amazon/B03rNVsvT" },
    { cat:"Lip care",   name:"WishCare Lip Balm",                      note:"Everyday balm for dry, pigmented lips.",                               url:"https://link.amazon/B09iR7egg" },
    { cat:"Makeup",     name:"Renée Midnight Kajal",                   note:"Smudge-proof black kajal that lasts the day.",                         url:"https://link.amazon/B071Vu8ra" },
  ];

  document.getElementById("list").innerHTML = products.map(p => `
    <li>
      <p class="cat">${p.cat}</p>
      <h2 class="name">${p.name}</h2>
      <p class="note">${p.note}</p>
      <a class="buy" href="${p.url}" target="_blank" rel="noopener sponsored">Buy on Amazon</a>
    </li>`).join("");
</script>
</body>
</html>
